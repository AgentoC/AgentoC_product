name: Build Windows setup executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: p2p/go.sum
      - name: Install pinned WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install wix --version 7.0.0 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI and setup executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $out = Join-Path $env:RUNNER_TEMP 'agentoc-release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $msi = Join-Path $out 'AgentoC-inner.msi'
          # Keep the public version at 0.0.1 while advancing MSI's internal
          # upgrade order beyond the already installed 0.0.15 package.
          & "$source\packaging\windows\build-msi.ps1" -SourceRoot $source -OutputPath $msi -Version '0.0.1.0' -MsiProductVersion '0.0.16'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msi)) { throw 'MSI build failed' }
          $brand = Join-Path $env:TEMP ('brand-' + [guid]::NewGuid().ToString('N'))
          & "$source\packaging\windows\generate-brand-assets.ps1" -SourceRoot $source -OutputDirectory $brand
          $exe = Join-Path $out 'AgentoC-0.0.1-windows-x64-setup.exe'
          & "$source\packaging\windows\build-setup-exe.ps1" -MsiPath $msi -IconPath (Join-Path $brand 'agentoc.ico') -OutputPath $exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw 'EXE build failed' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS.txt'), "$hash  AgentoC-0.0.1-windows-x64-setup.exe`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: agentoc-windows-setup
          path: |
            ${{ runner.temp }}/agentoc-release/AgentoC-0.0.1-windows-x64-setup.exe
            ${{ runner.temp }}/agentoc-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
