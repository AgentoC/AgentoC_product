name: Build Windows setup executable
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Public version (three numeric parts; same version is permitted)'
        required: true
        type: string
      msi_product_version:
        description: 'MSI product version newer than the latest published installer'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: p2p/go.sum
      - name: Install pinned WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install wix --version 7.0.0 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI and setup executable
        env:
          MSI_PRODUCT_VERSION: ${{ inputs.msi_product_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:GITHUB_WORKSPACE
          $out = Join-Path $env:RUNNER_TEMP 'agentoc-release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $msi = Join-Path $out 'AgentoC-inner.msi'
          # The internal MSI version must advance for every replacement package.
          $releaseVersion = $env:RELEASE_VERSION
          if ($releaseVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid public release version' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/ragent-app/Ragent_product/releases/latest' -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'Ragent-release-check' }
          $latestVersion = $release.tag_name -replace '^v', ''
          if ($latestVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or [version]$releaseVersion -lt [version]$latestVersion) { throw 'Public version cannot be older than the latest published release' }
          $versionMatch = [regex]::Match($release.body, '(?i)Windows Installer product version is\s+(\d+\.\d+\.\d+)')
          if (-not $versionMatch.Success) { throw 'Latest release notes must record the Windows Installer product version' }
          $latestMsiVersion = [version]$versionMatch.Groups[1].Value
          $msiVersion = $env:MSI_PRODUCT_VERSION
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$' -or [version]$msiVersion -le $latestMsiVersion) { throw 'MSI product version must exceed the version recorded in the latest release notes' }
          & "$source\packaging\windows\build-msi.ps1" -SourceRoot $source -OutputPath $msi -Version "$releaseVersion.0" -MsiProductVersion $msiVersion
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msi)) { throw 'MSI build failed' }
          $brand = Join-Path $env:TEMP ('brand-' + [guid]::NewGuid().ToString('N'))
          & "$source\packaging\windows\generate-brand-assets.ps1" -SourceRoot $source -OutputDirectory $brand
          $exeName = "Ragent-$releaseVersion-windows-x64-setup.exe"
          $exe = Join-Path $out $exeName
          & "$source\packaging\windows\build-setup-exe.ps1" -MsiPath $msi -IconPath (Join-Path $brand 'agentoc.ico') -OutputPath $exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw 'EXE build failed' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS.txt'), "$hash  $exeName`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: agentoc-windows-setup
          path: |
            ${{ runner.temp }}/agentoc-release/Ragent-*-windows-x64-setup.exe
            ${{ runner.temp }}/agentoc-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
