name: Public source boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-public-boundary.mjs
      - run: node tests/test-public-boundary.mjs
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/test-redirect-sensitive-headers.mjs
      - run: node tests/test-risk-dataset-benchmark.mjs
      - run: node --test --test-concurrency=1 tests/test-harness-registry.mjs tests/test-harness-policy.mjs tests/test-provider-contract.mjs tests/test-claude-adapter.mjs tests/test-accounts-server.mjs tests/test-demo-account-session.mjs tests/test-turn-broker-capability.mjs
