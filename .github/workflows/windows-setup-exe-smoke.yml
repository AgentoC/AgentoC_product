name: Windows setup EXE smoke test
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (drafts supported)
        required: true
      sha256:
        description: Expected installer SHA-256
        required: true
permissions:
  # GitHub exposes draft release assets only to identities with push access.
  contents: write
jobs:
  fresh-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and check the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'agentoc-installer'
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $files = @(Get-ChildItem $dir -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one installer' }
          $actual = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash
          if ($actual -ine $env:EXPECTED_SHA256) { throw 'Installer SHA-256 mismatch' }
      - name: Fresh install and health check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RUNNER_TEMP -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'A disposable GitHub-hosted runner is required' }
          $services = @('AgentoC-ControlPlane', 'AgentoC-RunnerSupervisor', 'AgentoC-PrivilegedBroker')
          if (@(Get-Service -Name $services -ErrorAction SilentlyContinue).Count) { throw 'Existing AgentoC service detected' }
          $installer = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'agentoc-installer') -Filter '*.exe' -File).FullName
          $log = Join-Path $env:RUNNER_TEMP 'agentoc-msi.log'
          $installStarted = (Get-Date).AddSeconds(-5)
          $p = Start-Process -FilePath $installer -ArgumentList @('/qn', '/norestart', '/l*v', ('"' + $log + '"')) -PassThru
          if (-not $p.WaitForExit(300000)) {
            Get-Process -Name msiexec,AgentoC* -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Responding,MainWindowTitle | Format-Table
            if (Test-Path $log) { Get-Content $log -Tail 35 } else { Write-Host 'MSI log was not created.' }
            throw 'Installer timed out after five minutes'
          }
          if ($p.ExitCode -ne 0) {
            Select-String -Path $log -Pattern 'Return value 3' -Context 20,5 | ForEach-Object { $_.ToString() }
            $diagnostic = 'C:\ProgramData\AgentoC\instances\owner\runtime\owner-msi-activation-failure.json'
            if (Test-Path -LiteralPath $diagnostic) { Get-Content -LiteralPath $diagnostic -Raw }
            # The installer can unregister its event source during rollback.
            # Filter the Application log by event ID first, then by provider;
            # requesting the removed provider directly can throw and obscure
            # the original installer exit code. Print only stable error codes.
            try {
              $events = Get-WinEvent -FilterHashtable @{ LogName='Application'; Id=@(1002,1004,1006,4101); StartTime=$installStarted } -MaxEvents 200 -ErrorAction Stop |
                Where-Object { $_.ProviderName -eq 'AgentoC' } | Select-Object -First 20
              foreach ($event in $events) {
                $values = @($event.Properties | ForEach-Object { [string]$_.Value })
                foreach ($value in $values) {
                  foreach ($match in [regex]::Matches($value, '\b(?:SHT|OAT|OAX|OMI)_[A-Z0-9_]+\b')) {
                    Write-Host ("AgentoC event {0}: {1}" -f $event.Id, $match.Value)
                  }
                }
              }
            } catch { Write-Host 'AgentoC startup event diagnostics unavailable.' }
            throw "Installer exited $($p.ExitCode)"
          }
          foreach ($name in $services) {
            if ((Get-Service -Name $name -ErrorAction Stop).Status -ne 'Running') { throw "$name is not running" }
          }
          $healthy = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try { if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7690/healthz' -TimeoutSec 2).StatusCode -eq 200) { $healthy = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) { throw 'Local health check failed' }
