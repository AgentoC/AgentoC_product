<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>AgentoC</title>
  <style>
    :root { color-scheme: light dark; font: 15px "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f6fa; color: #20242b; }
    main { width: min(440px, calc(100% - 40px)); padding: 36px; border: 1px solid #dce2ec; border-radius: 20px; background: white; box-shadow: 0 12px 40px #16244714; text-align: center; }
    img { width: 72px; height: 72px; object-fit: contain; }
    h1 { margin: 15px 0 7px; font-size: 23px; }
    p { margin: 0; color: #5b6472; line-height: 1.5; }
    button { min-height: 42px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 22px; background: #315bd7; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #9db3ff; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) { body { background: #161b22; color: #eef1f7; } main { border-color: #394150; background: #202731; } p { color: #b0bac9; } }
  </style>
</head>
<body>
  <main>
    <img src="assets/agentoc-android-logo.png" alt="">
    <h1>AgentoC is starting</h1>
    <p id="serviceState" role="status" aria-live="polite">Waiting for the local AgentoC service. This window will connect automatically when it is ready.</p>
    <button id="retry" type="button">Retry now</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", () => window.agentocDesktop?.retryService());
  </script>
</body>
</html>
